name: footprint
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.13.2
  flutter: '>=3.47.2'

workspace:
  - packages/route_snapshots
  - packages/component_library
  - packages/domain_models
  - packages/features/map
  - packages/features/route_list
  - packages/features/route_details
  - packages/foreground_location_service
  - packages/geocoding_manager
  - packages/routes_repository
  - packages/recording_service
  - packages/sqlite_storage
  - packages/route_planning
  - packages/features/explore
  - packages/features/statistics

dependencies:
  route_snapshots:
    path: packages/route_snapshots
  forui: ^0.26.0
  statistics:
    path: packages/features/statistics
  route_planning:
    path: packages/route_planning
  explore:
    path: packages/features/explore
  flutter:
    sdk: flutter

  domain_models:
    path: packages/domain_models
  foreground_location_service:
    path: packages/foreground_location_service
  geocoding_manager:
    path: packages/geocoding_manager
  routes_repository:
    path: packages/routes_repository
  recording_service:
    path: packages/recording_service
  component_library:
    path: packages/component_library
  map:
    path: packages/features/map
  route_list:
    path: packages/features/route_list
  route_details:
    path: packages/features/route_details
  sqlite_storage:
    path: packages/sqlite_storage
  go_router: ^18.0.1
  flutter_bloc: ^9.1.1

dev_dependencies:
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  integration_test:
    sdk: flutter
  sqflite_common_ffi: ^2.4.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
